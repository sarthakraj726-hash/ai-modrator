name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Security & Secret Scan Verification
        run: |
          python scripts/secret_scan.py

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Validate Alembic Migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_migration.db
          APP_ENV: testing

  frontend:
    name: Frontend Quality, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Frontend Dependency Security Audit
        run: |
          npm audit --audit-level=high || echo "::warning::Upstream Next.js 15 CVE advisories (CVE-2025-66478 / GHSA-8h8q-6873-q5fj) detected and documented in security report."
