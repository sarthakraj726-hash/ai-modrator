name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Security & Secret Scan Verification
        run: |
          python -c "
          import os, re, sys
          pats = [re.compile(r'AIza[0-9A-Za-z-_]{35}'), re.compile(r'sk-or-v1-[0-9a-f]{64}')]
          leaks = []
          for r, d, files in os.walk('.'):
              if any(p in r for p in ['.git', '.venv', '__pycache__', 'tests']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.json', '.yaml', '.yml', '.env', '.toml')):
                      path = os.path.join(r, f)
                      with open(path, encoding='utf-8', errors='ignore') as h:
                          for idx, l in enumerate(h, 1):
                              for p in pats:
                                  if p.search(l) and 'REDACTED' not in l and 'your_' not in l:
                                      leaks.append(f'{path}:{idx}')
          if leaks:
              print('Detected possible unredacted secrets:', leaks)
              sys.exit(1)
          print('Secret scan clean.')
          "

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Validate Alembic Migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_migration.db
          APP_ENV: testing

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
